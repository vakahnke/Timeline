# Production stack: nginx (TLS, serves built SPA + reverse-proxies) -> gunicorn -> Postgres,
# with certbot for Let's Encrypt certificates.
#
#   1) Point DNS (e.g. timeline.vakahnke.com) at the server's elastic IP.
#   2) Set DOMAIN + CERTBOT_EMAIL (and prod secrets) in .env.
#   3) ./deploy/init-letsencrypt.sh        # one-time: obtain the certificate
#   4) docker compose -f docker-compose.prod.yml up -d --build
#
# migrate + collectstatic run automatically on backend start.
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      RUN_COLLECTSTATIC: "1"
      POSTGRES_HOST: db
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}   # gunicorn workers; tune to instance size
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      target: prod
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: DOMAIN   # only substitute ${DOMAIN}, leave nginx $vars alone
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renew twice a day; certbot only acts when a cert is within 30 days of expiry.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'

volumes:
  pgdata:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_www:

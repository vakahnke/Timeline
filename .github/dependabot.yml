# Keeps dependencies current. Security fixes are opened as soon as an advisory is published
# (repository setting "Dependabot security updates"); the schedules below cover routine updates.
# Minor and patch updates are grouped into one pull request per ecosystem to keep the noise down;
# major versions arrive on their own so each can be read and tested.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /deploy]
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
